[project]
name = "terminus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chroma>=0.2.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-cerebras>=0.8.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.5.2",
    "openai>=3.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[tool.uv]
package = true

[project.scripts]
terminus = "terminus.cli:run"
