[project]
name = "terminus"
version = "0.1.0"
description = "A terminal coding agent: codebase Q&A, controlled edits, and planned multi-step work"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb",
    "fastembed>=0.8.0",
    "firecrawl-py>=4.44.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-cerebras>=0.8.2",
    "langchain-cohere>=0.4.0,<0.7.0",
    "langchain-fireworks>=1.3.1",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.5.2",
    "langchain-qdrant>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai<3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
      "sentence-transformers>=6.0.0",
      "typer>=0.15.0",
      "tree-sitter<0.22.0",
    "tree-sitter-languages>=1.10.2",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
terminus = "terminus.cli_app:main"

[tool.ruff]
line-length = 100
exclude = ["landing"]

[tool.ruff.lint]
# Rules that catch defects rather than style preferences.
# E4/E7/E9/W/F are ruff's own defaults. The rest were each added in response to
# a real defect found in review:
#   B   bugbear - mutable defaults, lost exception causes, blind asserts
#   RET dead control flow: an elif after a return/continue/break is never taken
#   PIE unnecessary pass, and lambdas that only call a constructor
#   C4 comprehensions that can be written directly
# E501 is deliberately not enabled: the prompt constants in agent/factory.py are
# prose meant to be read as prose, and reflowing them to a line limit would make
# them worse.
select = ["E4", "E7", "E9", "W", "F", "B", "RET", "PIE", "C4"]

[tool.ruff.lint.per-file-ignores]
# `raise typer.Exit(...)` after handling an error is control flow, not error
# wrapping: there is no underlying exception to chain, and `from` would invent
# one. The genuine lost-cause cases elsewhere in the project are fixed.
"src/terminus/cli_app/*.py" = ["B904"]
# Tests assert on shapes and introspect fixtures; a blind `pytest.raises(Exception)`
# is deliberate where the point is "this must not raise a traceback".
"tests/*" = ["B017"]

[tool.pytest.ini_options]
