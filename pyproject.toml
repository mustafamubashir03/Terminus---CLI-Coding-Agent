[project]
name = "terminus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb",
    "fastembed>=0.8.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-cerebras>=0.8.2",
    "langchain-fireworks>=1.3.1",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.5.2",
    "langchain-qdrant>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai<3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.0",
    "tree-sitter<0.22.0",
    "tree-sitter-languages>=1.10.2",
]

[tool.uv]
package = true

[project.scripts]
terminus = "terminus.cli:run"
