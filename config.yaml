llm:
  provider: fireworks
  model: kimi-k3

rag:
  mode: hybrid

vector_store:
  provider: qdrant
  retrieval_mode: hybrid

qdrant:
  collection_name: terminus_hybrid

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

chromadb:
  persist_dir: .chromadb/
  collection_name: terminus

elasticsearch:
  url: "http://localhost:9200"
  index_name: terminus
