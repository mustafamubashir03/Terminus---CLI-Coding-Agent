llm:
  provider: fireworks
  model: kimi-k3
  judge_model: kimi-k3

memory:
  db_path: .terminus/memory/terminus.db
  summarize_at_tokens: 4000
  max_messages: 20

tasks:
  db_path: .terminus/tasks/tasks.db

rag:
  mode: hybrid

vector_store:
  provider: qdrant
  retrieval_mode: hybrid

qdrant:
  collection_name: terminus_hybrid

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

chromadb:
  persist_dir: .terminus/chromadb/
  collection_name: terminus

skills:
  skills_dir: .terminus/skills

elasticsearch:
  url: "http://localhost:9200"
  index_name: .terminus/elasticsearch
